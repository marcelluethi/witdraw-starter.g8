# The Python environment DimWit and WitDraw run on: JAX for the tensors, BlackJax for NUTS.
# `sbt run` creates it with uv on first use.
# For a GPU, replace jax[cpu] by jax[cuda12].
[project]
name = "$name;format="norm"$"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]>=0.4",
    "blackjax>=1.5.0",
    "einops>=0.8",
]
